function pdfBlob(){const b=atob(PDF_B64),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:"application/pdf"});}
const $=id=>document.getElementById(id);
const AH="9ef64d11476e9a28ae207b1c1c1341cb3640cf4109bfa26a11e35ee10cbfa430";
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");}
$("admlink").onclick=()=>$("admbox").classList.toggle("hide");
$("alogin").onclick=async()=>{
  try{
    if(await sha($("au").value.trim()+":"+$("ap").value)===AH){$("pay").classList.add("hide");$("done").classList.remove("hide");$("done").querySelector(".price").textContent="✓ Admin access";}
    else $("aerr").textContent="Wrong username or password.";
  }catch(e){$("aerr").textContent="Login not available here.";}
};
$("unlock").onclick=()=>{
  const v=$("txn").value.trim();
  if(!/^[A-Za-z0-9]{10,30}$/.test(v)){$("err").textContent="Enter a valid transaction ID (at least 10 characters).";return;}
  $("pay").classList.add("hide");$("done").classList.remove("hide");
};
$("dl").onclick=async()=>{
  $("err2").textContent="";
  try{
    const d=await claude.use("downloads");
    if(d){await d.save({filename:"Tessolve-Questions-D.pdf",data:pdfBlob()});return;}
  }catch(e){if(e&&e.code==="declined")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(pdfBlob());a.download="Tessolve-Questions-D.pdf";document.body.appendChild(a);a.click();a.remove();
  $("err2").textContent="If nothing downloaded, open this page in your browser and try again.";
};
